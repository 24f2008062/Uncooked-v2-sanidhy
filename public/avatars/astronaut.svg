<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="astroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="60%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- Background Circle with deep cosmos -->
  <circle cx="50" cy="50" r="50" fill="url(#astroBg)"/>
  
  <!-- Little Stars -->
  <circle cx="20" cy="25" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="78" cy="20" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="82" cy="70" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="16" cy="65" r="1" fill="#f43f5e" opacity="0.7"/>

  <!-- Spacesuit Shoulders -->
  <path d="M18 100 C18 72 32 66 50 66 C68 66 82 72 82 100 Z" fill="url(#suitGrad)"/>
  <path d="M40 76 L60 76 L58 100 L42 100 Z" fill="#0284c7"/>
  <circle cx="34" cy="82" r="2.5" fill="#f43f5e"/>
  <circle cx="66" cy="82" r="2.5" fill="#10b981"/>

  <!-- Neck Ring Collar -->
  <ellipse cx="50" cy="64" rx="22" ry="7" fill="#64748b"/>
  <ellipse cx="50" cy="62" rx="20" ry="5.5" fill="#cbd5e1"/>

  <!-- Astronaut Helmet Outer -->
  <circle cx="50" cy="40" r="26" fill="url(#suitGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- Reflective Cosmic Visor -->
  <rect x="30" y="27" width="40" height="26" rx="13" fill="url(#visorGrad)"/>
  
  <!-- Visor Highlights & Star Reflection -->
  <path d="M34 32 C38 30 46 29 52 29" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <circle cx="62" cy="35" r="2" fill="#ffffff" opacity="0.6"/>
  <path d="M36 44 C42 47 56 47 62 43" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
</svg>
